[package]
name = "llmix-rs"
version = "2.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Rust binding for the LLMix orchestration contract with cache, resilience, and config parity"
repository = "https://github.com/singleware/llmix"
documentation = "https://docs.rs/llmix-rs"
readme = "README.md"
keywords = ["llm", "ai", "orchestration", "redis", "tokio"]
categories = ["asynchronous", "api-bindings"]

[features]
default = []
redis = ["dep:redis", "dep:url"]
helpers-openai = ["dep:reqwest", "dep:url", "dep:hyper-rustls"]
helpers-sno-gpu = ["helpers-openai"]
helpers-anthropic = ["dep:reqwest", "dep:url", "dep:hyper-rustls"]
helpers-gemini = ["dep:reqwest", "dep:url", "dep:hyper-rustls"]

[dependencies]
async-trait = "0.1.86"
fs2 = "0.4.3"
httpdate = "1.0.3"
indexmap = "=2.7.1"
lru = "0.12.5"
hyper-rustls = { version = "=0.27.7", optional = true }
reqwest = { version = "=0.12.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_yaml = "0.9"
sha2 = "0.10.8"
thiserror = "1.0.69"
tokio = { version = "1.43.0", features = ["fs", "macros", "rt", "sync", "time"] }
redis = { version = "0.32.7", optional = true, default-features = false, features = ["tokio-comp"] }
url = { version = "=2.5.0", optional = true }

[dev-dependencies]
tokio = { version = "1.43.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
