[project]
name = "llmix"
version = "2.0.0"
description = "Cross-runtime LLM orchestration for Python and TypeScript with L2 caching, retries, key rotation, and config-driven client"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
  "anthropic>=0.40.0",
  "google-genai>=1.18.0,<2",
  "httpx[http2]>=0.28.1,<0.29",
  "cachetools>=5.5.0,<6",
  "pyyaml>=6.0.2,<7",
  "json-repair>=0.58.0,<1",
]

[project.optional-dependencies]
redis = ["redis>=6.4.0,<8"]
dev = [
  "pyright>=1.1.0",
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
llmix = ["pricing.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["python/llmix"]
