[project]
name = "sno-llmix"
version = "2.0.3"
description = "Cross-runtime LLM orchestration for Python, TypeScript, and Rust with L2 caching, retries, key rotation, and config-driven runtime control"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "openai>=2.0.0",
  "anthropic>=0.40.0",
  "google-genai>=1.18.0,<3",
  "httpx[http2]>=0.28.1,<0.29",
  "cachetools>=5.5.0,<8",
  "pydantic>=2,<3",
  "snoai-mda-config>=1.1.1,<2",
  "json-repair>=0.58.0,<1",
  "openrouter>=0.9.1",
]

[project.optional-dependencies]
redis = ["redis>=6.4.0,<8"]
dev = [
  "pyright>=1.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
llmix = ["pricing.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["llmix"]
