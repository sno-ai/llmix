[package]
name = "snoai-mda-config"
version = "1.1.2"
edition = "2021"
rust-version = "1.83"
description = "Rust source-mode loader for MDA v1.0 configuration artifacts"
license = "Apache-2.0"
repository = "https://github.com/sno-ai/llmix"
homepage = "https://github.com/sno-ai/llmix/tree/main/packages/mda-config/rust"
readme = "README.md"
keywords = ["mda", "configuration", "frontmatter", "integrity", "sigstore"]
categories = ["config", "parser-implementations"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
base64 = "0.22"
indexmap = "=2.12.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.8"
thiserror = "2.0"
