[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snoai-mda-config"
version = "1.1.2"
description = "Python source-mode loader for MDA v1.0 configuration artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SnoAI" }]
keywords = ["mda", "configuration", "frontmatter", "integrity"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "jcs>=0.2.1,<0.3",
  "jsonschema>=4.20,<5",
  "pydantic>=2,<3",
  "ruamel.yaml>=0.18,<0.20",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/sno-ai/llmix/tree/main/packages/mda-config/python"
Repository = "https://github.com/sno-ai/llmix"
Issues = "https://github.com/sno-ai/llmix/issues"

[tool.hatch.build]
ignore-vcs = true
exclude = ["/.gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/snoai_mda_config"]
only-include = ["src/snoai_mda_config"]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]
exclude = [
  "/tests",
  "/fixtures",
  "/dist",
  "/uv.lock",
  "/.gitignore",
  "/.venv",
  "**/__pycache__",
  "**/*.pyc",
  "/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
