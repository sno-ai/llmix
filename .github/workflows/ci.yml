name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: |
          bun run check:typescript
          bun run check:mda-config

      - name: Test
        run: |
          bun run test:typescript
          bun run test:mda-config

  python:
    name: Python LLMix
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --project packages/llmix/python --extra dev

      - name: Type check
        run: uv run --project packages/llmix/python --extra dev pyright -p packages/llmix/python

      - name: Test
        run: uv run --project packages/llmix/python --extra dev pytest -c packages/llmix/python/pyproject.toml packages/llmix/python/tests

  python-mda-config:
    name: Python mda-config
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --project packages/mda-config/python --all-groups

      - name: Lint
        run: uv run --project packages/mda-config/python ruff check packages/mda-config/python

      - name: Type check
        run: uv run --project packages/mda-config/python pyright -p packages/mda-config/python

      - name: Test
        run: uv run --project packages/mda-config/python pytest -c packages/mda-config/python/pyproject.toml packages/mda-config/python/tests

  rust:
    name: Rust
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83

      - name: Check
        run: |
          cargo check --manifest-path packages/llmix/rust/Cargo.toml
          cargo check --manifest-path packages/mda-config/rust/Cargo.toml

      - name: Test
        run: |
          cargo test --manifest-path packages/llmix/rust/Cargo.toml
          cargo test --manifest-path packages/mda-config/rust/Cargo.toml
