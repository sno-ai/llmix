name: Claude Code Review

# Runs on the shared self-hosted runner so Claude OAuth review matches the
# working sno-nodix/sno-nexus setup.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  # Auto PR review — architecture-level analysis on every non-draft PR
  claude-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            The PR branch is already checked out. You are the ARCHITECTURE REVIEWER.
            Diffs alone are not enough — read full file(s) to understand surrounding context.

            Before reviewing, read any CLAUDE.md, AGENTS.md, or README at the repo root
            to understand the codebase conventions, tech stack, and architecture.

            ## YOUR ROLE
            You review for architectural and design-level issues. A separate bug-hunting
            review (Codex) runs in parallel on the same PR — do NOT duplicate its work.

            ## FOCUS AREAS (architecture and design only)
            - Cross-file impact: does this change break callers, contracts, or assumptions elsewhere?
            - Design pattern violations: wrong abstraction level, leaky interfaces, tight coupling
            - Business logic correctness: does the implementation match the PR's stated intent?
            - Async/await architecture: missing cancellation, unhandled rejections, deadlock risk
            - API contract changes: breaking changes to public interfaces, missing migrations
            - State management: duplicated state, stale cache risks, missing invalidation
            - Error propagation: swallowed errors, missing context, inconsistent error strategy
            - Missing abstractions or duplicated logic across files

            ## SEVERITY LEVELS
            - **CRITICAL**: Breaking change, data loss, security flaw, or production outage risk
            - **HIGH**: Correctness bug, architectural violation, or regression
            - **MEDIUM**: Design concern that will cause pain if not addressed now
            - **LOW**: Minor improvement suggestion with clear justification

            ## OUTPUT RULES
            - Report issues only. Never praise code. Never summarize what the PR does.
            - If no issues found, say: "No architectural issues found."
            - One finding per comment. At most 1 paragraph per finding.
            - State the severity, the problem, and a concrete recommendation.
            - Be concise — sacrifice grammar for clarity.

            ## DO NOT FLAG
            - Formatting, naming style, import order (handled by linters)
            - Pre-existing issues not introduced by this PR
            - Minor personal style preferences
            - Anything a linter or type checker would catch
            - Discrete bugs in individual functions (handled by Codex)

            Use `gh pr comment` with your Bash tool to post your review.

          claude_args: "--model opus --allowed-tools \"Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob\""

  # Interactive @claude — responds to @claude mentions from repo members only.
  # SECURITY INVARIANT: This job is intentionally read-only (contents: read,
  # allowed-tools limited to Read/Grep/Glob/gh view/comment). Do NOT add
  # contents: write, Edit, Write, or broader Bash tools — any MEMBER/COLLABORATOR
  # can supply arbitrary instructions via @claude mentions.
  claude:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: [self-hosted, linux, x64]
    concurrency:
      group: claude-interactive-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Resolve PR head ref (for issue_comment on PRs)
        id: resolve-ref
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "ref=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ steps.resolve-ref.outputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: "--model opus --allowed-tools \"Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue comment:*),Bash(gh issue view:*),Read,Grep,Glob\""
