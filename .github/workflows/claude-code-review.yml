name: Claude Code Review

# Matches the Claude Code review flow used by sibling repos.
# This repo has no self-hosted runner assigned, so use GitHub-hosted runners.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude-review:
    name: Claude architecture review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            The PR branch is already checked out. You are the ARCHITECTURE REVIEWER.
            Diffs alone are not enough; read full files to understand surrounding context.

            Before reviewing, read any CLAUDE.md, AGENTS.md, .claude/rules/*.md, or README
            at the repo root to understand the codebase conventions, tech stack, and architecture.

            ## YOUR ROLE
            Review architecture and design-level issues for the LLMix monorepo.
            A separate bug-hunting review may run in parallel; do not duplicate its work.

            ## REPO CONTEXT
            - LLMix is the product layer for model routing, fallback, caching, and runtime config.
            - mda-config is the foundational MDA loading/signing package used by LLMix and downstream users.
            - Public package names and runtime APIs are compatibility-sensitive.
            - Release order matters: publish mda-config packages before LLMix packages that depend on them.

            ## FOCUS AREAS
            - Cross-package impact across TypeScript, Python, and Rust.
            - Public API or package metadata changes that would break existing users.
            - Monorepo path, workspace, fixture, and release workflow mistakes.
            - Config/security behavior, especially MDA signature and integrity handling.
            - Async/cancellation and retry architecture for provider calls.
            - Error propagation, cache invalidation, and fallback behavior.

            ## SEVERITY LEVELS
            - CRITICAL: Breaking change, data loss, security flaw, or production outage risk.
            - HIGH: Correctness bug, architectural violation, or regression.
            - MEDIUM: Design concern that will cause pain if not addressed now.
            - LOW: Minor improvement suggestion with clear justification.

            ## OUTPUT RULES
            - Report issues only. Never praise code. Never summarize what the PR does.
            - If no issues found, say: "No architectural issues found."
            - One finding per comment. At most one paragraph per finding.
            - State the severity, the problem, and a concrete recommendation.
            - Be concise; sacrifice grammar for clarity.

            ## DO NOT FLAG
            - Formatting, naming style, import order, or issues handled by linters.
            - Pre-existing issues not introduced by this PR.
            - Minor personal style preferences.
            - Discrete bugs in individual functions unless they indicate a design problem.

            Use `gh pr comment` with your Bash tool to post your review.

          claude_args: "--model claude-opus-4-6 --allowed-tools \"Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob\""

  claude:
    name: Claude interactive
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    concurrency:
      group: claude-interactive-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Resolve PR head ref
        id: resolve-ref
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          echo "ref=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ steps.resolve-ref.outputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: "--model claude-opus-4-6 --allowed-tools \"Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh issue comment:*),Bash(gh issue view:*),Read,Grep,Glob\""
