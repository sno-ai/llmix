name: Release LLMix

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish @snoai/llmix to npm"
        required: false
        default: true
        type: boolean
      publish_pypi:
        description: "Publish sno-llmix to PyPI"
        required: false
        default: false
        type: boolean
      publish_rust:
        description: "Publish llmix-rs to crates.io"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish npm
    if: ${{ github.event.repository.private == false && (github.event_name == 'release' || inputs.publish_npm == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check npm package contents
        working-directory: packages/llmix/typescript
        run: |
          npm pack --dry-run --json > /tmp/llmix-npm-pack.json
          node <<'NODE'
          const fs = require("fs");
          const pack = JSON.parse(fs.readFileSync("/tmp/llmix-npm-pack.json", "utf8"));
          const files = pack[0]?.files?.map((entry) => entry.path) ?? [];
          const allowed = /^(dist\/.*|src\/.*|data\/.*|README\.md|package\.json)$/;
          const unexpected = files.filter((path) => !allowed.test(path));
          if (unexpected.length > 0) {
            console.error("Unexpected files in npm package:");
            for (const path of unexpected) {
              console.error(`- ${path}`);
            }
            process.exit(1);
          }
          NODE

      - name: Publish npm package
        working-directory: packages/llmix/typescript
        run: npm publish --access public

  publish-pypi:
    name: Publish PyPI
    if: ${{ github.event.repository.private == false && (github.event_name == 'release' || inputs.publish_pypi == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build --project packages/llmix/python --out-dir packages/llmix/python/dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/llmix/python/dist

  publish-crates:
    name: Publish crates.io
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.publish_rust }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.83

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        working-directory: packages/llmix/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
