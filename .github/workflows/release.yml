name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_rust:
        description: "Publish llmix-rs to crates.io"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish npm
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check npm package contents
        run: |
          npm pack --dry-run --json > /tmp/llmix-npm-pack.json
          node <<'NODE'
          const fs = require("fs");
          const pack = JSON.parse(fs.readFileSync("/tmp/llmix-npm-pack.json", "utf8"));
          const files = pack[0]?.files?.map((entry) => entry.path) ?? [];
          const allowed = /^(typescript\/(dist|src)\/.*|data\/.*|README\.md|LICENSE|CHANGELOG\.md|package\.json)$/;
          const unexpected = files.filter((path) => !allowed.test(path));
          if (unexpected.length > 0) {
            console.error("Unexpected files in npm package:");
            for (const path of unexpected) {
              console.error(`- ${path}`);
            }
            process.exit(1);
          }
          NODE

      - name: Publish npm package
        run: npm publish --access public --provenance

  publish-pypi:
    name: Publish PyPI
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish crates.io
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.publish_rust }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100

      - name: Publish crate
        working-directory: rust/llmix-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
