name: Bug report
description: Report a defect in LLMix
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more reproduction
        detail you can give us, the faster we can fix it.

  - type: input
    id: version
    attributes:
      label: LLMix version
      description: e.g. `@snoai/llmix` 2.0.1, `sno-llmix` 2.0.1, `llmix-rs` 2.0.0
      placeholder: 2.0.1
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Python
        - TypeScript
        - Rust
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A self-contained snippet (and MDA preset, if relevant) that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, language version, provider, anything else relevant.
    validations:
      required: false
